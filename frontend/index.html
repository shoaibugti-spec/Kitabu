<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کِتٰٰبُ — پورا قرآن، صرف قرآن</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1>کِتٰٰبُ</h1>
  <p class="tagline">پورا قرآن، صرف قرآن</p>
</header>

<main id="app">

  <!-- مرکزی مینیو -->
  <section id="view-menu" class="view active">
    <div class="menu-grid">
      <button class="menu-btn" onclick="location.href='reader.html'">
        <span class="icon">📖</span>
        <span>پڑھنا</span>
      </button>
      <button class="menu-btn" data-view="listen">
        <span class="icon">🎧</span>
        <span>سننا</span>
      </button>
      <button class="menu-btn" data-view="learn">
        <span class="icon">🎓</span>
        <span>سیکھنا</span>
      </button>
      <button class="menu-btn" data-view="ask">
        <span class="icon">💬</span>
        <span>پوچھنا</span>
      </button>
    </div>
    <p id="status-line" class="status-line"></p>
  </section>

  <!-- پڑھنا -->
  <section id="view-read" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>📖 پڑھنا</h2>
    <div class="row">
      <label>سورہ نمبر (1-114):</label>
      <input type="number" id="surah-input" min="1" max="114" value="1">
      <button id="load-surah-btn">لوڈ کریں</button>
    </div>
    <div id="surah-result" class="verses-list"></div>
  </section>

  <!-- سننا -->
  <section id="view-listen" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>🎧 سننا</h2>
    <div class="row">
      <label>سورہ:</label>
      <input type="number" id="listen-surah" min="1" max="114" value="1">
      <label>آیت:</label>
      <input type="number" id="listen-ayah" min="1" value="1">
      <select id="reciter-select">
        <option value="alafasy">العفاسی</option>
        <option value="husary">الحصری</option>
        <option value="sudais">السدیس</option>
        <option value="minshawi">المنشاوی</option>
        <option value="abdulbasit">عبدالباسط</option>
      </select>
      <button id="play-btn">▶️ سنیں</button>
    </div>
    <audio id="audio-player" controls style="width:100%; margin-top:1rem;"></audio>
    <div id="listen-verse" class="verses-list"></div>
  </section>

  <!-- سیکھنا -->
  <section id="view-learn" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>🎓 سیکھنا</h2>
    <p class="hint">یہاں آپ کوئی بھی آیت کھول کر عربی متن پر غور کر سکتے ہیں، تلاوت سن سکتے ہیں، اور ترجمے سے موازنہ کر کے حفظ/تجوید کی مشق کر سکتے ہیں۔</p>
    <div class="row">
      <label>سورہ:</label>
      <input type="number" id="learn-surah" min="1" max="114" value="1">
      <button id="learn-load-btn">شروع کریں</button>
    </div>
    <div id="learn-result" class="verses-list"></div>
  </section>

  <!-- پوچھنا -->
  <section id="view-ask" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>💬 پوچھنا</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="ask-tab">سوال پوچھیں</button>
      <button class="tab-btn" data-tab="verify-tab">دعویٰ تصدیق کریں</button>
    </div>

    <div id="ask-tab" class="tab-panel active">
      <textarea id="question-input" placeholder="مثلاً: صبر کے بارے میں قرآن کیا کہتا ہے؟"></textarea>
      <button id="ask-btn">پوچھیں</button>
      <div id="ask-result" class="verses-list"></div>
    </div>

    <div id="verify-tab" class="tab-panel">
      <div class="row">
        <label>سورہ:</label>
        <input type="number" id="verify-surah" min="1" max="114" value="1">
        <label>آیت:</label>
        <input type="number" id="verify-ayah" min="1" value="1">
      </div>
      <textarea id="claim-input" placeholder="وہ دعویٰ لکھیں جس کی تصدیق کرنی ہے..."></textarea>
      <button id="verify-btn">تصدیق کریں</button>
      <div id="verify-result" class="verses-list"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>عربی متن: Tanzil.net | تلاوت: EveryAyah.com — نیت: صرف قرآن کی خدمت</p>
</footer>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
