<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کِتٰٰبُ — پورا قرآن، صرف قرآن</title>
<link rel="stylesheet" href="css/style.css">
<!-- Amiri Font for Arabic -->
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
</head>
<body>

<header class="topbar">
  <h1>کِتٰٰبُ</h1>
  <p class="tagline">پورا قرآن، صرف قرآن</p>
</header>

<main id="app">

  <!-- Home Menu -->
  <section id="view-menu" class="view active">
    <div class="menu-grid">
      <button class="menu-btn" data-view="read">
        <span class="icon">📖</span>
        <span>پڑھنا</span>
      </button>
      <button class="menu-btn" data-view="listen">
        <span class="icon">🎧</span>
        <span>سننا</span>
      </button>
      <button class="menu-btn" data-view="learn">
        <span class="icon">🎓</span>
        <span>سیکھنا</span>
      </button>
      <button class="menu-btn" data-view="ask">
        <span class="icon">💬</span>
        <span>پوچھنا</span>
      </button>
    </div>
    <p id="status-line" class="status-line"></p>
  </section>

  <!-- READ VIEW (New) -->
  <section id="view-read" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>📖 پڑھنا</h2>
    <div class="form-row">
      <label>سورہ نمبر:</label>
      <input type="number" id="read-surah" min="1" max="114" value="1">
      <button id="read-load-btn" class="primary-btn">کھولیں</button>
    </div>
    <div id="read-result" class="verses-list"></div>
  </section>

  <!-- LISTEN VIEW -->
  <section id="view-listen" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>🎧 سننا</h2>
    <div class="form-row">
      <label>سورہ:</label>
      <input type="number" id="listen-surah" min="1" max="114" value="1">
      
      <label>آیت:</label>
      <input type="number" id="listen-ayah" min="1" value="1">
      
      <select id="reciter-select">
        <option value="Alafasy_128kbps">العفاسی</option>
        <option value="Husary_128kbps">الحصری</option>
        <option value="Minshawy_Murattal_128kbps">المنشاوی</option>
        <option value="Abdul_Basit_Murattal_192kbps">عبدالباسط</option>
      </select>
      
      <button id="play-btn" class="primary-btn">▶️ سنیں</button>
    </div>
    
    <audio id="audio-player" controls style="width:100%; margin-top:1rem; display:none;"></audio>
    <div id="listen-verse" class="verses-list"></div>
  </section>

  <!-- LEARN VIEW -->
  <section id="view-learn" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>🎓 سیکھنا</h2>
    <p class="hint">سورہ منتخب کریں، عربی متن پڑھیں، ترجمے سے موازنہ کریں۔</p>
    
    <div class="form-row">
      <label>سورہ نمبر:</label>
      <input type="number" id="learn-surah" min="1" max="114" value="1">
      <button id="learn-load-btn" class="primary-btn">شروع کریں</button>
    </div>
    
    <div id="learn-result" class="verses-list"></div>
  </section>

  <!-- ASK & VERIFY VIEW -->
  <section id="view-ask" class="view">
    <button class="back-btn" data-back>⬅ واپس</button>
    <h2>💬 پوچھنا / تصدیق</h2>

    <div class="tabs">
      <button class="tab-btn active" data-tab="ask-tab">سوال پوچھیں</button>
      <button class="tab-btn" data-tab="verify-tab">دعویٰ تصدیق کریں</button>
    </div>

    <!-- Tab 1: Search -->
    <div id="ask-tab" class="tab-panel active">
      <textarea id="question-input" placeholder="مثلاً: صبر کے بارے میں قرآن کیا کہتا ہے؟"></textarea>
      <button id="ask-btn" class="primary-btn">تلاش کریں</button>
      <div id="ask-result" class="verses-list"></div>
    </div>

    <!-- Tab 2: Verify Claim -->
    <div id="verify-tab" class="tab-panel">
      <div class="form-row">
        <label>سورہ:</label>
        <input type="number" id="verify-surah" min="1" max="114" value="1">
        <label>آیت:</label>
        <input type="number" id="verify-ayah" min="1" value="1">
      </div>
      <textarea id="claim-input" placeholder="وہ دعویٰ لکھیں جس کی تصدیق کرنی ہے..."></textarea>
      <button id="verify-btn" class="primary-btn">تصدیق کریں</button>
      <div id="verify-result" class="verses-list"></div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>عربی متن: Tanzil.net | تلاوت: EveryAyah.com<br>نیت: صرف قرآن کی خدمت</p>
</footer>

<!-- Scripts Order Matters -->
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
