<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پڑھنا — کِتٰٰبُ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --arabic-size: 2.2rem; --urdu-size: 1.3rem; --en-size: 1.05rem; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; color: #000; font-family: 'Noto Nastaliq Urdu', serif; }
    body { overflow: hidden; }
    .topbar { position: fixed; inset: 0 0 auto; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 15px; background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    .title-row, .controls, .font-size-group, .ayah-buttons, .ayah-actions { display: flex; align-items: center; gap: 8px; }
    .topbar h2 { margin: 0; color: #0f172a; font-size: 1.2rem; }
    button, select { font: inherit; cursor: pointer; }
    .ctrl-btn { border: 0; border-radius: 8px; padding: 8px 14px; background: #0f172a; color: #fff; font-weight: 700; }
    .ctrl-btn.playing { background: #16a34a; }
    .font-size-group { padding: 4px; border-radius: 8px; background: #e2e8f0; }
    .font-size-group button { border: 0; border-radius: 6px; padding: 4px 10px; background: transparent; font-weight: 700; }
    .font-size-group button.active { background: #0f172a; color: #fff; }
    .surah-select { max-width: 180px; padding: 6px 10px; border: 2px solid #e2e8f0; border-radius: 8px; background: #fff; }
    .reader { position: absolute; inset: 70px 0 0; overflow-y: auto; padding: 30px 20px 200px; scroll-behavior: smooth; }
    .ayah { max-width: 800px; margin: 0 auto 40px; padding: 20px; border-radius: 12px; }
    .ayah.playing { background: #fef3c7; box-shadow: 0 0 0 2px #fbbf24; }
    .arabic { color: #000; direction: rtl; text-align: right; margin-bottom: 18px; font-family: 'Amiri Quran', serif; font-size: var(--arabic-size); line-height: 2.6; }
    .translation-ur { color: #1e293b; direction: rtl; text-align: right; margin-bottom: 10px; font-size: var(--urdu-size); line-height: 2.2; }
    .translation-en { color: #475569; direction: ltr; text-align: left; margin-bottom: 15px; font-family: Georgia, serif; font-size: var(--en-size); line-height: 1.7; }
    .ayah-actions { justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid #e2e8f0; }
    .ref { color: #64748b; font-size: .9rem; font-weight: 700; }
    .ayah-buttons button { border: 0; border-radius: 6px; padding: 6px 12px; background: #f1f5f9; }
    .loading { padding: 40px; color: #64748b; text-align: center; font-size: 1.2rem; }
    @media (max-width: 600px) { .topbar { padding: 8px 10px; } .topbar h2 { font-size: 1rem; } .reader { padding: 20px 12px 200px; } .ayah { padding: 15px; margin-bottom: 30px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="title-row"><button class="ctrl-btn" onclick="location.href='./'">← واپس</button><h2 id="surahTitle">سورہ الفاتحہ</h2></div>
    <div class="controls">
      <select class="surah-select" id="surahSelect"></select>
      <div class="font-size-group">
        <button id="fs-s" onclick="setFontSize('s')">ا</button>
        <button id="fs-m" onclick="setFontSize('m')">ا</button>
        <button id="fs-l" onclick="setFontSize('l')">ا</button>
        <button id="fs-xl" onclick="setFontSize('xl')">ا</button>
      </div>
    </div>
  </header>
  <main class="reader" id="reader"><div class="loading">لوڈ ہو رہا ہے...</div></main>

  <script src="js/api.js"></script>
  <script>
    const NAMES = ['الفاتحہ','البقرہ','آل عمران','النساء','المائدہ','الانعام','الاعراف','الانفال','التوبہ','یونس','ہود','یوسف','الرعد','ابراہیم','الحجر','النحل','الاسراء','الکہف','مریم','طہ','الانبیاء','الحج','المومنون','النور','الفرقان','الشعراء','النمل','القصص','العنکبوت','الروم','لقمان','السجدہ','الاحزاب','سبا','فاطر','یٰسین','الصافات','ص','الزمر','المومن','حم السجدہ','الشوری','الزخرف','الدخان','الجاثیہ','الاحقاف','محمد','الفتح','الحجرات','ق','الذاریات','الطور','النجم','القمر','الرحمن','الواقعہ','الحدید','المجادلہ','الحشر','الممتحنہ','الصف','الجمعہ','المنافقون','التغابن','الطلاق','التحریم','الملک','القلم','الحاقہ','المعارج','نوح','الجن','المزمل','المدثر','القیامہ','الانسان','المرسلات','النبا','النازعات','عبس','التکویر','الانفطار','المطففین','الانشقاق','البروج','الطارق','الاعلی','الغاشیہ','الفجر','البلد','الشمس','اللیل','الضحی','الشرح','التین','العلق','القدر','البینہ','الزلزال','العادیات','القارعہ','التکاثر','العصر','الہمزہ','الفیل','قریش','الماعون','الکوثر','الکافرون','النصر','اللہب','الاخلاص','الفلق','الناس'];
    const FONT_SIZES = { s: ['1.6rem','1rem','.9rem'], m: ['2.2rem','1.3rem','1.05rem'], l: ['2.9rem','1.7rem','1.2rem'], xl: ['3.6rem','2.1rem','1.35rem'] };
    const reader = document.getElementById('reader');
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function setFontSize(s) {
      const [ar, ur, en] = FONT_SIZES[s];
      document.documentElement.style.setProperty('--arabic-size', ar);
      document.documentElement.style.setProperty('--urdu-size', ur);
      document.documentElement.style.setProperty('--en-size', en);
      document.querySelectorAll('.font-size-group button').forEach(b => b.classList.remove('active'));
      document.getElementById('fs-' + s).classList.add('active');
      localStorage.setItem('kitabu_font', s);
    }

    async function loadSurah(n) {
      const number = Number(n);
      reader.innerHTML = '<div class="loading">لوڈ ہو رہا ہے...</div>';
      try {
        const data = await KitabuAPI.surah(number);
        if (!data.verses.length) throw new Error('سورہ نہیں ملی');
        document.getElementById('surahTitle').textContent = `سورہ ${NAMES[number - 1] || number}`;
        let html = number !== 1 && number !== 9
          ? '<div class="ayah"><div class="arabic" style="text-align:center">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div></div>'
          : '';
        html += data.verses.map(v => `
          <article class="ayah" id="ayah-${v.surah}-${v.ayah}">
            <div class="arabic">${esc(v.text)}</div>
            ${v.ur ? `<div class="translation-ur">${esc(v.ur)}</div>` : ''}
            ${v.en ? `<div class="translation-en">${esc(v.en)}</div>` : ''}
            <div class="ayah-actions">
              <span class="ref">سورہ ${v.surah}، آیت ${v.ayah}</span>
              <div class="ayah-buttons">
                <button data-play="${v.surah}:${v.ayah}">🔊 سنیں</button>
              </div>
            </div>
          </article>`).join('');
        reader.innerHTML = html;
        reader.scrollTop = 0;
      } catch (e) {
        reader.innerHTML = `<div class="loading">⚠️ ${esc(e.message)}</div>`;
      }
    }

    let currentAudio = null;
    reader.addEventListener('click', e => {
      const play = e.target.closest('[data-play]');
      if (!play) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      document.querySelectorAll('.ayah.playing').forEach(el => el.classList.remove('playing'));
      const [s, a] = play.dataset.play.split(':').map(Number);
      const el = document.getElementById(`ayah-${s}-${a}`);
      if (el) { el.classList.add('playing'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
      const pad = x => String(x).padStart(3,'0');
      currentAudio = new Audio(`https://everyayah.com/data/Alafasy_128kbps/${pad(s)}${pad(a)}.mp3`);
      currentAudio.play().catch(() => {});
      currentAudio.onended = () => { el?.classList.remove('playing'); currentAudio = null; };
    });

    const select = document.getElementById('surahSelect');
    NAMES.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = i + 1;
      opt.textContent = `${i + 1}. ${name}`;
      select.appendChild(opt);
    });
    select.addEventListener('change', () => loadSurah(select.value));

    (async function init() {
      setFontSize(localStorage.getItem('kitabu_font') || 'm');
      select.value = 1;
      await loadSurah(1);
    })();
  </script>
</body>
</html>
